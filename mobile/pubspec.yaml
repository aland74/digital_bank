name: distributedbank_mobile
description: "Distributed Bank — Premium Digital Banking for Kurdistan Region"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Secure storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Biometric authentication
  local_auth: ^2.2.0

  # Push notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # QR code
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # Camera (card scanner — disabled, requires extra setup)
  # camera: ^0.11.0
  # google_mlkit_text_recognition: ^0.13.0

  # UI
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  pull_to_refresh: ^2.0.0
  flutter_animate: ^4.5.0
  image_picker: ^1.0.7

  # Date/time
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^6.0.0

  # UUID generation
  uuid: ^4.0.0

  # Deep linking
  app_links: ^6.3.2

  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
